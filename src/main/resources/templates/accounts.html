<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${bankName}">Mini Bank</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<header class="topbar">
    <h1 th:text="${bankName}">Mini Bank</h1>
</header>

<main class="container">
    <section class="card">
        <h2>All accounts</h2>

        <table>
            <thead>
            <tr>
                <th>Account</th>
                <th>Type</th>
                <th>Holder</th>
                <th class="num">Balance (EUR)</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="account : ${accounts}">
                <td th:text="${account.accountNumber}">1001</td>
                <td th:text="${account.accountType}">Checking</td>
                <td th:text="${account.holder}">George</td>
                <td class="num"
                    th:classappend="${account.balance.signum() < 0} ? 'negative'"
                    th:text="${account.balance}">150.00</td>
            </tr>
            </tbody>
        </table>

        <p class="summary">
            Total deposits: <strong th:text="${total}">0.00</strong> EUR
            · Customers: <span th:text="${#strings.listJoin(customers, ', ')}">Anna, George</span>
        </p>
    </section>
</main>

</body>
</html>
