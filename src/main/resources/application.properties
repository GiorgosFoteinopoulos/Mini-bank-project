spring.application.name=mini-bank
bank.admin.username=admin
bank.admin.password=${ADMIN_PASSWORD:admin123}
bank.name=Mini Bank Athens

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/minibank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

bank.schedule.new-day=${NEW_DAY_CRON:0 0 0 * * *}
bank.schedule.interest=${INTEREST_CRON:0 0 0 1 1 *}